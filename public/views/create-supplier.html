<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CrossFire NCR</title>
    <!-- Bootstrap Icons link -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- Bootstrap link -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="../css/style.css" />
    <script defer src="../js/components/cf-sidebar.js"></script>
  </head>

  <body>
    <cf-sidebar></cf-sidebar>
    <div class="content">
      <div class="dashboard">
        <div class="home-content">
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb" style="justify-content: flex-start">
              <li class="breadcrumb-item">
                <a href="index.html">Dashboard</a>
              </li>
              <li class="breadcrumb-item">
                <a href="supplier.html">Suppliers</a>
              </li>
              <li class="breadcrumb-item active" aria-current="page">
                Create Supplier
              </li>
            </ol>
          </nav>
          <section class="ncr-trends">
            <div class="top-flex">
              <h2>New Supplier</h2>
            </div>
            <form id="supplier-form">
              <fieldset class="border p-2">
                <legend class="w-auto">Supplier</legend>
                <div
                  id="error-message"
                  class="error-message"
                  style="color: red"
                ></div>
                <!-- Error message container -->
                <div class="">
                  <div class="form-group">
                    <label for="supName" class="required">Supplier Name</label>
                    <input
                      type="text"
                      id="supName"
                      name="products-supplied"
                      aria-required="true"
                      placeholder="Supplier Name or Company"
                    />
                  </div>
                  <div class="two-column">
                    <div class="form-group">
                      <label for="supContactName" class="required"
                        >Contact Name</label
                      >
                      <input
                        type="text"
                        id="supContactName"
                        aria-required="true"
                        name="supplier-code"
                      />
                    </div>
                    <div class="form-group">
                      <label for="supContactEmail" class="required"
                        >Email</label
                      >
                      <input
                        type="text"
                        id="supContactEmail"
                        aria-required="true"
                        name="supplier-email"
                      />
                    </div>
                    <div class="form-group">
                      <label for="supContactPhone" class="required"
                        >Phone</label
                      >
                      <input
                        type="text"
                        id="supContactPhone"
                        aria-required="true"
                        name="supplier-phone"
                      />
                    </div>
                  </div>
                </div>

                <div class="form-group">
                  <label for="supAddress" class="required">Address</label>
                  <input
                    type="text"
                    id="supAddress"
                    aria-required="true"
                    name="supplier-address"
                  />
                </div>
                <div class="form-group">
                  <label for="supCity" class="required">City</label>
                  <input
                    type="text"
                    id="supCity"
                    aria-required="true"
                    name="supplier-city"
                  />
                </div>
                <div class="form-group">
                  <label for="supCountry" class="required">Country</label>
                  <input
                    type="text"
                    id="supCountry"
                    aria-required="true"
                    name="supplier-country"
                  />
                </div>
              </fieldset>
              <div class="form-group submit-btn-container">
                <button
                  type="button"
                  class="cancel-btn"
                  onclick="window.location.href='supplier.html';"
                >
                  Cancel
                </button>
                <button type="submit" class="submit-btn">Add Supplier</button>
              </div>
            </form>
          </section>
        </div>
      </div>
    </div>
    <script src="../assets/js/main/user-role-handling.js"></script>
    <script src="../assets/js/main/sidebar.js"></script>
    <script defer src="../assets/js/supplier/create-supplier.js"></script>
    <script src="../assets/js/main/inject-notification-modal.js"></script>
    <script src="../assets/js/main/notification-handling.js"></script>
  </body>

  <!-- Error Modal -->
  <div
    class="modal fade"
    id="errorModal"
    tabindex="-1"
    aria-labelledby="errorModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="errorModalLabel">Validation Errors</h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>
        <div class="modal-body">
          <ul id="errorList"></ul>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Close
          </button>
        </div>
      </div>
    </div>
  </div>
</html>
