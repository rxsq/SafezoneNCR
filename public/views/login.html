<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <style>
      .split-screen {
        height: 100vh;
      }

      .left-side {
        background-image: url("https://images.pexels.com/photos/323705/pexels-photo-323705.jpeg");
        background-size: cover;
        background-position: center;
      }

      .right-side {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .login-box {
        max-width: 400px;
        width: 100%;
        padding: 30px;
        background-color: white;
        border-radius: 8px;
        text-align: center;
      }

      .logo {
        margin-bottom: -75px;
      }

      .logo img {
        width: 100%;
        max-width: 250px;
        object-fit: contain;
      }
    </style>
  </head>

  <body>
    <div class="container-fluid split-screen">
      <div class="row h-100">
        <div class="col-md-6 left-side d-none d-md-block"></div>
        <div class="col-md-6 right-side">
          <div class="login-box">
            <div class="logo">
              <img
                src="../assets/crossfire_logo_no_bkgd.png"
                alt="CrossFire Niagara Logo"
              />
            </div>
            <form id="loginForm">
              <div class="input-group mb-3">
                <div class="input-group-prepend">
                  <span class="input-group-text" id="basic-addon1"
                    ><i class="bi bi-person"></i
                  ></span>
                </div>
                <input
                  type="text"
                  class="form-control"
                  id="username"
                  placeholder="Email or Username"
                  aria-label="Username"
                  aria-describedby="basic-addon1"
                  required
                />
              </div>

              <div class="input-group mb-3">
                <div class="input-group-prepend">
                  <span class="input-group-text" id="basic-addon2"
                    ><i class="bi bi-eye"></i
                  ></span>
                </div>
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  placeholder="Password"
                  aria-label="Password"
                  aria-describedby="basic-addon1"
                  required
                />
              </div>

              <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const username = document.getElementById("username").value.trim();
          const password = document.getElementById("password").value;

          try {
            const { user } = await api("POST", "/api/auth/login", {
              username,
              password,
            });
            sessionStorage.setItem("userRole", user.role);
            sessionStorage.setItem("userName", user.name);
            sessionStorage.setItem("empID", String(user.empID));
            window.location.href = "index.html";
          } catch (err) {
            alert(err.message || "Login failed");
          }
        });
    </script>
  </body>
</html>
