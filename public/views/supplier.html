<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suppliers</title>
    <!-- Bootstrap Icons link -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- Bootstrap link -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="../css/style.css" />
    <script defer src="../js/components/cf-sidebar.js"></script>
  </head>

  <body>
    <div id="loading-spinner-wrapper" class="loading-spinner-wrapper">
      <div class="spinner"></div>
    </div>
    <cf-sidebar></cf-sidebar>
    <div class="content">
      <div class="dashboard">
        <div class="home-content">
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb" style="justify-content: flex-start">
              <li class="breadcrumb-item">
                <a href="index.html">Dashboard</a>
              </li>
              <li class="breadcrumb-item active" aria-current="page">
                Suppliers
              </li>
            </ol>
          </nav>
          <section class="ncr-trends">
            <div class="top-flex">
              <h2>Suppliers</h2>
              <button
                class="new-suppliers-btn"
                id="new-suppliers-btn"
                onclick="window.location.href='create-supplier.html';"
              >
                + New Supplier
              </button>
            </div>
            <table class="table table-striped table-hover">
              <thead>
                <tr>
                  <th>Supplier Name</th>
                  <th>Contact Name</th>
                  <th>Contact Email</th>
                  <th>Contact Phone</th>
                  <th class="text-center">Actions</th>
                </tr>
              </thead>
              <tbody id="supplier-list"></tbody>
            </table>
          </section>
          <div id="pagination-controls" class="pagination-container"></div>

          <div id="page-number" class="page-number"></div>
        </div>
      </div>
    </div>

    <!-- Delete Modal -->
    <div
      class="modal fade"
      id="deleteModal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="exampleModalLabel">Confirm Delete</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body" id="deleteModalBody"></div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
              id="btnDeleteYes"
            >
              Yes
            </button>
            <button type="button" class="btn btn-primary" id="btnDeleteNo">
              No
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Edit Modal -->
    <div
      class="modal fade"
      id="editModal"
      tabindex="-1"
      aria-labelledby="editModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="editModalLabel">Edit Supplier</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form id="editForm">
              <div class="row">
                <input type="hidden" class="form-control" id="editSupID" />
                <div class="col-md-9 mb-3">
                  <label for="editSupplierName" class="form-label"
                    >Supplier Name</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="editSupplierName"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="editContactName" class="form-label"
                    >Contact Name</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="editContactName"
                    required
                  />
                </div>
                <div class="col-md-6 mb-3">
                  <label for="editContactEmail" class="form-label"
                    >Contact Email</label
                  >
                  <input
                    type="email"
                    class="form-control"
                    id="editContactEmail"
                    required
                  />
                </div>
                <div class="col-md-6 mb-3">
                  <label for="editContactPhone" class="form-label"
                    >Contact Phone</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="editContactPhone"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="editAddress" class="form-label">Address</label>
                  <input
                    type="text"
                    class="form-control"
                    id="editAddress"
                    required
                  />
                </div>
                <div class="col-md-6 mb-3">
                  <label for="editCity" class="form-label">City</label>
                  <input
                    type="text"
                    class="form-control"
                    id="editCity"
                    required
                  />
                </div>
                <div class="col-md-6 mb-3">
                  <label for="editCountry" class="form-label">Country</label>
                  <input
                    type="text"
                    class="form-control"
                    id="editCountry"
                    required
                  />
                </div>
                <input type="hidden" id="supID" />
                <!-- Hidden input to store the supplier ID -->
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="button" class="btn btn-primary" id="btnSaveChanges">
              Save Changes
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- View Modal -->
    <div
      class="modal fade"
      id="viewModal"
      tabindex="-1"
      aria-labelledby="viewModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="viewModalLabel">Supplier Details</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div id="viewModalContent">
              <p>
                <strong>Supplier Name:</strong>
                <span id="viewSupplierName"></span>
              </p>
              <p>
                <strong>Contact Name:</strong>
                <span id="viewContactName"></span>
              </p>
              <p>
                <strong>Contact Email:</strong>
                <span id="viewContactEmail"></span>
              </p>
              <p>
                <strong>Contact Phone:</strong>
                <span id="viewContactPhone"></span>
              </p>
              <p><strong>Address:</strong> <span id="viewAddress"></span></p>
              <p><strong>City:</strong> <span id="viewCity"></span></p>
              <p><strong>Country:</strong> <span id="viewCountry"></span></p>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
          </div>
        </div>
      </div>
    </div>
    <script defer src="../assets/js/main/sidebar.js"></script>
    <script type="module" src="../assets/js/supplier/handle-data.js"></script>
    <script src="../assets/js/main/user-role-handling.js"></script>
    <script src="../assets/js/supplier/user-restriction-handling.js"></script>
    <script src="../assets/js/main/inject-notification-modal.js"></script>
    <script src="../assets/js/main/notification-handling.js"></script>
  </body>
</html>
