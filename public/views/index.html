<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CrossFire NCR</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Bootstrap Icons link -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- Bootstrap link -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="../css/style.css" />

    <script defer src="../js/components/cf-sidebar.js"></script>
  </head>

  <div id="loading-spinner-wrapper" class="loading-spinner-wrapper">
    <div class="spinner"></div>
  </div>

  <body>
    <cf-sidebar></cf-sidebar>

    <div class="home-content">
      <div>
        <header>
          <h1>Non-Conformance Report Dashboard</h1>
          <div class="actions">
            <button
              class="new-ncr-btn"
              onclick="location.href='non-conformance-report.html'"
              id="new-ncr-btn"
              style="display: none"
            >
              + New NCR
            </button>
            <button
              class="export-data-btn"
              onclick="window.location.href='ncr-data.html'"
            >
              See Analytics
            </button>
          </div>
        </header>

        <section class="key-metrics">
          <div class="metric-card">
            <h2>Total</h2>
            <a href="#">
              <p id="metricTotal">0</p>
            </a>
          </div>
          <div class="metric-card">
            <h2>Open</h2>
            <a href="#">
              <p id="metricActive">0</p>
            </a>
          </div>
          <div class="metric-card">
            <h2>Closed</h2>
            <a href="#">
              <p id="metricInactive">0</p>
            </a>
          </div>
        </section>

        <section class="ncr-trends">
          <h2>NCR Analytics</h2>
          <div class="two-column">
            <div class="form-group">
              <div class="chart">
                <canvas id="issueDateChart"></canvas>
              </div>
            </div>
            <div class="form-group">
              <div class="chart">
                <canvas id="supplierChart"></canvas>
              </div>
            </div>
          </div>
        </section>

        <section class="ncr-trends">
          <h2 id="ncr-heading">
            Most Recent NCR's for [User Name] in [Department Name]
          </h2>
          <table class="table table-striped table-hover" id="ncrRecentTable">
            <thead>
              <tr>
                <th><a href="#">NCR No</a></th>
                <th><a href="#">Supplier</a></th>
                <th><a href="#">Issue Date</a></th>
                <th><a href="#">Stage</a></th>
                <th class="text-center">Actions</th>
              </tr>
            </thead>
            <tbody id="tbodyRecentNCR"></tbody>
          </table>
          <div class="view-more-btn-container">
            <button onclick="location.href='ncr-log.html'">View More</button>
          </div>
        </section>
      </div>
    </div>

    <script src="../assets/js/main/sidebar.js"></script>
    <script src="../assets/js/ncr/handle-data.js"></script>
    <script src="../assets/js/main/user-role-handling.js"></script>
    <script src="../assets/js/main/inject-notification-modal.js"></script>
    <script src="../assets/js/main/notification-handling.js"></script>
    <script src="../assets/js/ncr/user-restriction-handling.js"></script>
  </body>
</html>
