<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Product</title>
    <!-- Bootstrap Icons link -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- Bootstrap link -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="../css/style.css" />
    <script defer src="../js/components/cf-sidebar.js"></script>
  </head>

  <body>
    <div class="content">
      <div class="dashboard">
        <cf-sidebar></cf-sidebar>
        <div class="home-content">
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb" style="justify-content: flex-start">
              <li class="breadcrumb-item">
                <a href="index.html">Dashboard</a>
              </li>
              <li class="breadcrumb-item">
                <a href="product.html">Products</a>
              </li>
              <li class="breadcrumb-item active" aria-current="page">
                Create Product
              </li>
            </ol>
          </nav>
          <section class="ncr-trends">
            <div class="top-flex">
              <h2>New Product</h2>
            </div>
            <form id="supplier-form">
              <fieldset class="border p-2">
                <legend class="w-auto">Product Information</legend>
                <div
                  id="error-message"
                  class="error-message"
                  style="color: red"
                ></div>
                <div class="">
                  <div class="form-group">
                    <label for="product-name">Product Name</label>
                    <i
                      class="bi bi-question-circle text-primary"
                      data-bs-toggle="tooltip"
                      data-bs-placement="right"
                      title="Product Name is required in this filed."
                    ></i>
                    <input
                      type="text"
                      id="product-name"
                      name="product-name"
                      required
                    />
                  </div>
                  <div class="two-column">
                    <div class="form-group">
                      <label for="product-category">Product Category</label>
                      <i
                        class="bi bi-question-circle text-primary"
                        data-bs-toggle="tooltip"
                        data-bs-placement="right"
                        title="Product Category is required in this filed."
                      ></i>
                      <input
                        type="text"
                        id="product-category"
                        name="product-category"
                      />
                    </div>
                    <div class="form-group">
                      <label for="supplier-name">Supplier</label>
                      <i
                        class="bi bi-question-circle text-primary"
                        data-bs-toggle="tooltip"
                        data-bs-placement="right"
                        title="Select a supplier name from the dropdown list."
                      ></i>
                      <select id="supplier-name" name="supplier-name">
                        <!--Populate in code-->
                      </select>
                    </div>
                  </div>
                </div>
              </fieldset>
              <div class="form-group submit-btn-container">
                <button
                  type="button"
                  class="cancel-btn"
                  onclick="window.location.href='supplier.html';"
                >
                  Cancel
                </button>
                <button type="submit" class="submit-btn" id="btnSubmit">
                  Create
                </button>
              </div>
            </form>
          </section>
        </div>
      </div>
    </div>

    <!-- Success Modal -->
    <div
      class="modal fade"
      id="successModal"
      tabindex="-1"
      aria-labelledby="successModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="successModalLabel">Success</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body" id="successModalBody">
            <!-- Success message will be injected here -->
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-primary" id="btnDismiss">
              OK
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Error Modal -->
    <div
      class="modal fade"
      id="errorModal"
      tabindex="-1"
      aria-labelledby="errorModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="errorModalLabel">Error</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body" id="errorModalBody">
            <!-- Error message will be injected here -->
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="../assets/js/product/create-product.js"></script>
    <script src="../assets/js/main/sidebar.js"></script>
    <script src="../assets/js/main/user-role-handling.js"></script>
    <script defer src="../assets/js/product/populate-form-fields.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <
    <script>
      // Initialize all tooltips on the page
      document.addEventListener("DOMContentLoaded", function () {
        const tooltipTriggerList = [].slice.call(
          document.querySelectorAll('[data-bs-toggle="tooltip"]')
        );
        tooltipTriggerList.forEach(function (tooltipTriggerEl) {
          new bootstrap.Tooltip(tooltipTriggerEl);
        });
      });
    </script>
    <script src="../assets/js/main/inject-notification-modal.js"></script>
    <script src="../assets/js/main/notification-handling.js"></script>
  </body>
</html>
